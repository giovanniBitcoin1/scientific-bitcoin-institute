name: Data collector

# Refreshes a few public data series (scripts/data/collect.mjs) and publishes
# them on the branch `data`, for other tools to read at
#   https://raw.githubusercontent.com/<owner>/<repo>/data/<file>
#
# The branch always holds exactly ONE commit (an orphan commit, force-pushed),
# so the repository does not grow. Nothing here touches `main`, and a push made
# with the workflow token does not start other workflows: no deploy is triggered.

on:
  schedule:
    - cron: '17 * * * *' # every hour at minute 17 (GitHub may start it late)
  workflow_dispatch:

permissions:
  contents: write # to push the `data` branch

concurrency:
  group: data-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The collector is incremental: it starts from the files already published.
      - name: Fetch the published files
        run: |
          mkdir -p _data
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch --quiet --depth=1 origin data
            git archive FETCH_HEAD | tar -x -C _data
          else
            echo "No data branch yet: first run."
          fi

      - name: Collect
        run: node scripts/data/collect.mjs --out _data

      - name: Publish as a single commit on the data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp scripts/data/README.md _data/README.md
          cd _data
          rm -rf .git
          git init --quiet --initial-branch=data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "Data snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --quiet --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      - name: Summary
        if: always()
        run: |
          if [ -f _data/status.json ]; then
            echo '## Data collector' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat _data/status.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
